# Checkpoint and original configuration file available at https://huggingface.co/OMatG/MP-20-CSP/tree/main/Trig-SDE-Gamma.
model:
  si:
    class_path: omg.si.stochastic_interpolants.StochasticInterpolants
    init_args:
      stochastic_interpolants:
        # chemical species
        - class_path: omg.si.single_stochastic_interpolant_identity.SingleStochasticInterpolantIdentity
        # fractional coordinates
        - class_path: omg.si.single_stochastic_interpolant.SingleStochasticInterpolant
          init_args:
            interpolant: omg.si.interpolants.PeriodicTrigonometricInterpolant
            gamma:
              class_path: omg.si.gamma.LatentGammaSqrt
              init_args:
                a: 0.049242906264339095
            epsilon:
              class_path: omg.si.epsilon.VanishingEpsilon
              init_args:
                c: 9.418703639528207
                mu: 0.1967838464371502
                sigma: 0.040028404066547216
            differential_equation_type: "SDE"
            integrator_kwargs:
              method: "euler"
              dt: 0.02036734693877551
            velocity_annealing_factor: 0.0
            correct_center_of_mass_motion: true
        # lattice vectors
        - class_path: omg.si.single_stochastic_interpolant.SingleStochasticInterpolant
          init_args:
            interpolant: omg.si.interpolants.TrigonometricInterpolant
            gamma: null
            epsilon: null
            differential_equation_type: "ODE"
            integrator_kwargs:
              method: "euler"
            velocity_annealing_factor: 0.0
            correct_center_of_mass_motion: false
      data_fields:
        # if the order of the data_fields changes,
        # the order of the above StochasticInterpolant inputs must also change
        - "species"
        - "pos"
        - "cell"
      integration_time_steps: 50
  relative_si_costs:
    species_loss: 0.0
    pos_loss_b: 0.24677273761024368
    pos_loss_z: 0.7231540118244248
    cell_loss_b: 0.030073250565331323
  sampler:
    class_path: omg.sampler.IndependentSampler
    init_args:
      pos_distribution:
        class_path: omg.sampler.position_distributions.UniformPositionDistribution
      cell_distribution:
        class_path: omg.sampler.cell_distributions.InformedLatticeDistribution
        init_args:
          dataset_name: mp_20
      species_distribution:
        class_path: omg.sampler.species_distributions.MirrorSpecies
  model:
    class_path: omg.model.model.Model
    init_args:
      encoder:
        class_path: omg.model.encoders.cspnet_full.CSPNetFull
      head:
        class_path: omg.model.heads.pass_through.PassThrough
      time_embedder:
        class_path: omg.model.model_utils.SinusoidalTimeEmbeddings
        init_args:
          dim: 256
  use_min_perm_dist: True
  float_32_matmul_precision: "high"
  validation_mode: "match_rate"
  dataset_name: "mp_20"
data:
  train_dataset:
    class_path: omg.datamodule.StructureDataset
    init_args:
      file_path: "data/mp_20/train.lmdb"
      lazy_storage: True
      niggli_reduce: True
  val_dataset:
    class_path: omg.datamodule.StructureDataset
    init_args:
      file_path: "data/mp_20/val.lmdb"
      lazy_storage: True
      niggli_reduce: True
  pred_dataset:
    class_path: omg.datamodule.StructureDataset
    init_args:
      file_path: "data/mp_20/test.lmdb"
      lazy_storage: True
      niggli_reduce: True
  batch_size: 1024  # Was 32
trainer:
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "best_val_loss_total"
        save_top_k: 1
        monitor: "val_loss_total"
        save_weights_only: true
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "best_val_match_rate"
        save_top_k: 1
        monitor: "match_rate"
        save_weights_only: true
        mode: 'max'
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "best_val_rmsd"
        save_top_k: 1
        monitor: "mean_rmsd"
        save_weights_only: true
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_top_k: -1  # Store every checkpoint after 100 epochs.
        monitor: "val_loss_total"
        every_n_epochs: 100
        save_weights_only: false
  gradient_clip_val: 0.5
  num_sanity_val_steps: 0
  precision: "32-true"
  max_epochs: 2000
  enable_progress_bar: false
  check_val_every_n_epoch: 100
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 9.320780466656964e-05
