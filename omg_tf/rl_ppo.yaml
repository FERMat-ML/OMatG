model:
  residual_model:
    #class_path: omg.model.model.Model
    #init_args:
    #  encoder:
    #    class_path: omg.model.encoders.cspnet_full.CSPNetFull
    #    init_args:
    #      initialize_zeros: true
    #  head:
    #    class_path: omg.model.heads.pass_through.PassThrough
    #  time_embedder:
    #    class_path: omg.model.model_utils.SinusoidalTimeEmbeddings
    #    init_args:
    #      dim: 256
    class_path: omg_tf.time_mlp.TimeMLP
    init_args:
      hidden_dimension: 64
      number_hidden_layers: 2
      initialize_zeros: true
      shared_trunk: true
  reward:
    class_path: omg_tf.rewards.CRMSEReward
    init_args:
      scale: 100.0
      number_cpus: 4
  noise_schedules:
    pos:
      class_path: omg_tf.noise_schedules.ConstantNoiseSchedule
      init_args:
        noise_scale: 0.1
    cell:
      class_path: omg_tf.noise_schedules.ConstantNoiseSchedule
      init_args:
        noise_scale: 0.2
  grpo_group_size: 32
  grpo_num_groups: 16
  grpo_share_x_0: false
  relative_costs:
    pos_policy: 0.4
    cell_policy: 0.4
    pos_regularization: 0.1
    cell_regularization: 0.1
  position_normalization: per_atom_surrogate
  reference_sigma: 1e-3
  ppo_clip_epsilon: 0.2
  ppo_epochs: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: value
  residual_mode: "scale"
trainer:
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        filename: "best_val_reward_mean"
        save_top_k: 1
        monitor: "val_reward_mean"
        mode: max
        save_weights_only: false
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_top_k: -1  # Store every checkpoint after 100 epochs.
        monitor: "val_reward_mean"
        every_n_epochs: 1
        save_weights_only: false
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        leave: True
  num_sanity_val_steps: 0
  precision: "32-true"
  max_epochs: 2000
  enable_progress_bar: true
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.0001
