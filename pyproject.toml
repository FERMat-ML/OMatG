[build-system]
requires = ["setuptools>=75", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "omg"
readme = "README.md"
requires-python = ">=3.11,<3.14"
version = "1.2.1"
dependencies = [
    "numpy ~= 2.4",
    "scipy ~= 1.17",
    "torch ~= 2.10",
    "lightning[extra] ~= 2.6",
    "jsonargparse == 4.41",
    "torch_geometric ~= 2.7",
    "torch_scatter ~= 2.1",
    "torchdiffeq ~= 0.2",
    "torchsde ~= 0.2",
    "lmdb ~= 1.7",
    "loguru ~= 0.7",
    "ase ~= 3.27",
    "pytest ~= 9.0",
    "tqdm ~= 4.67",
    "smact ~= 4.0",  # TODO: Test DNG results, currently requires python < 3.14
    "wandb ~= 0.25",
    "scikit-learn ~= 1.8",
    "matplotlib ~= 3.10",
    "pymatgen ~= 2025.10",
    "spglib ~= 2.7",
    "pyyaml ~= 6.0",
    "matminer ~= 0.10",
    "huggingface_hub ~= 1.6",  # TODO: Test download of datasets
    "pyarrow ~= 23.0",
    "mace-torch ~= 0.3",
    "torch-sim-atomistic ~= 0.5"
]

[project.scripts]
omg = "omg.main:main"
omg_load = "omg.main:load"
omg_irl = "omg.omg_irl.main:main"

[tool.setuptools.packages.find]
where = ["."]
